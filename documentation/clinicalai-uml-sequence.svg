<text x="1830" y="241" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#142732">Service</text>
<polyline points="1830,335 1830,2350" fill="none" stroke="#80a9c5" stroke-width="2" stroke-dasharray="12 11"/>
